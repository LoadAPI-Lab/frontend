name: CI

on:
    push:
        branches: [main, dev]
        paths-ignore: ['**.md', '.gitignore']
    pull_request:
        branches: [main, dev]
        paths-ignore: ['**.md']
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        name: Lint, types, unit tests, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check the API client matches the spec
              run: |
                  pnpm api:generate
                  git add --intent-to-add src/api/generated
                  git diff --exit-code -- src/api/generated

            - name: Check formatting
              run: pnpm format:check

            - name: Lint
              run: pnpm lint

            - name: Type check
              run: pnpm typecheck

            - name: Unit and component tests
              run: pnpm test:c

            - name: Build
              run: pnpm build

    browser:
        name: Storybook and E2E (mocked)
        runs-on: ubuntu-latest
        needs: checks
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browser
              run: pnpm exec playwright install chromium

            - name: Storybook tests (interactions + a11y)
              run: pnpm test:storybook

            - name: E2E (MSW mocks)
              run: pnpm test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
