openapi: 3.1.0
info:
    title: Pet Store
    version: 1.0.0
servers:
    - url: https://pets.example.com/v1
paths:
    /pets:
        get:
            summary: List pets
            tags: [pets]
        post:
            summary: Add a pet
            tags: [pets]
    /pets/{petId}:
        parameters:
            - name: petId
              in: path
              required: true
              schema:
                  type: string
        get:
            summary: Get a pet
            tags: [pets]
    /users:
        get:
            summary: List users
            tags: [users]
    /health:
        get:
            summary: Health check
